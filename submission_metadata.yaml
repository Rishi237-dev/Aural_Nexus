# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  ≤200 word summary of your approach. Strongly recommended.

We built a four-stage AI recruitment pipeline capable of identifying the most relevant candidates from a pool of 100,000 profiles for a given Job Description.
Stage 1: Candidate Gate filters the raw pool to approximately 85,000 candidates using a conservative, recall-first philosophy. Six rule-based checkers evaluate experience range, profile completeness, hard JD constraints, technology overlap and explicit negative requirements. The gate rejects only when there is a clear, JD-backed reason — "never on ambiguity". "False negatives are treated as more costly than false positives."

Stage 2: Hybrid Retrieval Engine reduces 85,000 candidates to a high-recall shortlist of 3,000 using two independent retrieval signals. Candidate profiles are transformed into semantic documents (embedded offline using E5) and lexical documents (optimized for BM25 exact matching). A FAISS IndexFlatIP index powers dense retrieval; BM25Okapi powers lexical retrieval. Both ranked lists are fused using Reciprocal Rank Fusion with no manual weight tuning. A bounded Redrob confidence multiplier [0.85–1.05] applies a small availability adjustment without overriding semantic relevance.

Stage 3: The output — 3,000 candidates with full retrieval score breakdowns — is handed to a downstream ranking engine that applies evidence scoring, consistency checking, and career progression analysis to produce the final list. "At this stage precision is our biggest weapon with which we only target for the True Positives"

Stage 4: We derive a final formulae which enable us to take all the previous metrices as weighted input and derive the final , the best list of 100 candidates who match the JD in the best possible way and with proper analysiss of various track records.

